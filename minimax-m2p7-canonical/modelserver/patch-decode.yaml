apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 8                          # HIGH-SCALE knob: 8 × TP4 = 32 H100 (decode)
  template:
    spec:
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          args:
            - "MiniMaxAI/MiniMax-M2.7"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--trust-remote-code"
            - "--tensor-parallel-size=4"        # 4× H100
            - "--block-size=128"
            - "--max-model-len=131072"
            - "--kv-cache-dtype=fp8"
            - "--enable-prefix-caching"
            - "--enable-chunked-prefill"
            - "--enable-expert-parallel"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=minimax_m2"
            - "--reasoning-parser=minimax_m2_append_think"
            - "--no-disable-hybrid-kv-cache-manager"
            - "--port=8200"                     # decode vLLM behind the routing sidecar
            - "--kv-transfer-config"
            - '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both"},{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":107374182400}}]}}'
            - "--compilation-config={\"cudagraph_mode\":\"PIECEWISE\"}"
            # NOTE: the approximate prefix-cache-scorer needs NO --kv-events-config.
            # For PRECISE routing, add it per IDEAL-deploy-guide.md §4.3 (tcp://*:5556).
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
              value: "120"
          resources:
            limits:
              cpu: "48"
              memory: 320Gi
              nvidia.com/gpu: "4"
            requests:
              cpu: "48"
              memory: 320Gi
              nvidia.com/gpu: "4"
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi

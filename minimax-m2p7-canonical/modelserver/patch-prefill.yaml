apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefill
spec:
  replicas: 4                          # HIGH-SCALE knob: 4 × TP4 = 16 H100 (prefill)
  template:
    spec:
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          args:
            - "MiniMaxAI/MiniMax-M2.7"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--trust-remote-code"
            - "--tensor-parallel-size=4"        # 4× H100
            - "--block-size=128"
            - "--max-model-len=131072"
            - "--kv-cache-dtype=fp8"            # FP8 KV cache
            - "--enable-prefix-caching"        # prefix caching (+ emits KV events)
            - "--enable-chunked-prefill"       # chunked prefill
            - "--enable-expert-parallel"       # MoE wide expert parallelism
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=minimax_m2"
            - "--reasoning-parser=minimax_m2_append_think"
            - "--no-disable-hybrid-kv-cache-manager"
            # P/D disaggregation (NIXL) STACKED WITH CPU offload via MultiConnector.
            # Verified shape vs vLLM multi_connector.py (connectors[] of KVTransferConfig).
            - "--kv-transfer-config"
            - '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both"},{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":107374182400}}]}}'
            # KV events feed the EPP precise-prefix-cache-scorer. $(VAR) is expanded by k8s.
            - "--kv-events-config"
            - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://$(GAIE_RELEASE_NAME)-epp.$(NAMESPACE).svc.cluster.local:5557","topic":"kv@$(POD_IP)@MiniMaxAI/MiniMax-M2.7"}'
            - "--compilation-config={\"cudagraph_mode\":\"PIECEWISE\"}"   # CUDA graphs
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: GAIE_RELEASE_NAME
              value: "minimax-m2p7-highscale-pd"   # the router (EPP) helm release name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
              value: "120"
          resources:
            limits:
              cpu: "48"
              memory: 320Gi              # FP8 weights staging + 100 GiB CPU KV tier
              nvidia.com/gpu: "4"
            requests:
              cpu: "48"
              memory: 320Gi
              nvidia.com/gpu: "4"
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi

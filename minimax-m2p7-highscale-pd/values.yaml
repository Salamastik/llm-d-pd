# Install with:
# helm dependency update ./guides/minimax-m2p5-precise-pd
# helm upgrade --install minimax-pd-precise ./guides/minimax-m2p5-precise-pd -n <namespace> --create-namespace


gaie:
  inferenceExtension:
    replicas: 1
    flags:
      kv-cache-usage-percentage-metric: "vllm:kv_cache_usage_perc"
      v: 4
    image:
      name: llm-d-inference-scheduler
      hub: ghcr.io/llm-d
      tag: v0.6.0
      pullPolicy: Always
    extProcPort: 9002
    extraContainerPorts:
      - name: zmq
        containerPort: 5557
        protocol: TCP
    extraServicePorts:
      - name: zmq
        port: 5557
        targetPort: 5557
        protocol: TCP
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: hf-token
            key: HF_TOKEN
    sidecar:
      enabled: true
      image: ghcr.io/llm-d/llm-d-uds-tokenizer:v0.6.0
      imagePullPolicy: IfNotPresent
      name: tokenizer-uds
      env:
        - name: TOKENIZERS_DIR
          value: /tokenizers
        - name: HF_HOME
          value: /tokenizers
      volumeMounts:
        - mountPath: /tokenizers
          name: tokenizers
        - mountPath: /tmp/tokenizer
          name: tokenizer-uds
    volumes:
      - name: tokenizers
        emptyDir: {}
      - name: tokenizer-uds
        emptyDir: {}
    volumeMounts:
      - mountPath: /tmp/tokenizer
        name: tokenizer-uds
    pluginsConfigFile: "pd-precise-config.yaml"
    pluginsCustomConfig:
      pd-precise-config.yaml: |
        apiVersion: inference.networking.x-k8s.io/v1alpha1
        kind: EndpointPickerConfig
        featureGates:
        - prepareDataPlugins
        plugins:
        - type: prefill-header-handler
        - type: precise-prefix-cache-scorer
          parameters:
            tokenProcessorConfig:
              blockSize: 128
            indexerConfig:
              tokenizersPoolConfig:
                modelName: "MiniMaxAI/MiniMax-M2.5"
                local: null
                hf: null
                uds:
                  socketFile: /tmp/tokenizer/tokenizer-uds.socket
            kvEventsConfig:
              topicFilter: "kv@"
              concurrency: 4
              discoverPods: false
              zmqEndpoint: "tcp://*:5557"
        - type: kv-cache-utilization-scorer
        - type: queue-scorer
        - type: prefill-filter
        - type: decode-filter
        - type: max-score-picker
        - type: prefix-based-pd-decider
          parameters:
            nonCachedTokens: 16
        - type: pd-profile-handler
          parameters:
            primaryPort: 0
            deciderPluginName: prefix-based-pd-decider
            threshold: 256
        schedulingProfiles:
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: max-score-picker
          - pluginRef: precise-prefix-cache-scorer
            weight: 3.0
          - pluginRef: kv-cache-utilization-scorer
            weight: 2.0
          - pluginRef: queue-scorer
            weight: 2.0
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: max-score-picker
          - pluginRef: precise-prefix-cache-scorer
            weight: 3.0
          - pluginRef: kv-cache-utilization-scorer
            weight: 2.0
          - pluginRef: queue-scorer
            weight: 2.0
    tracing:
      enabled: false
    monitoring:
      interval: "10s"
      prometheus:
        enabled: true
        auth:
          enabled: false
          # secretName: minimax-pd-precise-gateway-sa-metrics-reader-secret
  inferencePool:
    targetPorts:
      - number: 8000
    modelServerType: vllm
    modelServers:
      matchLabels:
        llm-d.ai/inference-serving: "true"
        llm-d.ai/guide: "minimax-m2p5-precise-pd"
  # provider:
  #   name: istio
  #   istio:
  #     destinationRule:
  #       trafficPolicy:
  #         connectionPool:
  #           http:
  #             http1MaxPendingRequests: 256000
  #             maxRequestsPerConnection: 256000
  #             http2MaxRequests: 256000
  #             idleTimeout: "900s"
  #           tcp:
  #             maxConnections: 256000
  #             maxConnectionDuration: "1800s"
  #             connectTimeout: "900s"

modelservice:
  multinode: false
  modelArtifacts:
    uri: "hf://MiniMaxAI/MiniMax-M2.5"
    size: 300Gi
    authSecretName: "hf-token"
    name: "MiniMaxAI/MiniMax-M2.5"
    labels:
      llm-d.ai/inference-serving: "true"
      llm-d.ai/guide: "minimax-m2p5-precise-pd"
      llm-d.ai/accelerator-variant: "gpu"
      llm-d.ai/accelerator-vendor: "nvidia"
      llm-d.ai/model: "MiniMax-M2.5"
  accelerator:
    type: nvidia
  routing:
    servicePort: 8000
    proxy:
      image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.6.0
      connector: nixlv2
      secure: false
      zapLogLevel: error
  decode:
    parallelism:
      tensor: 4
    create: true
    replicas: 2
    monitoring:
      podmonitor:
        enabled: true
        portName: "vllm"
        path: "/metrics"
        interval: "30s"
    containers:
      - name: "vllm"
        image: ghcr.io/llm-d/llm-d-cuda:v0.5.1
        modelCommand: vllmServe
        args:
          - "--trust-remote-code"
          - "--block-size"
          - "128"
          - "--max-model-len"
          - "131072"
          - "--gpu-memory-utilization"
          - "0.92"
          - "--enable-auto-tool-choice"
          - "--tool-call-parser"
          - "minimax_m2"
          - "--reasoning-parser"
          - "minimax_m2_append_think"
          - "--kv-transfer-config"
          - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          - "--kv-events-config"
          - |
            {
              "enable_kv_cache_events": true,
              "publisher": "zmq",
              "endpoint": "tcp://$(GAIE_RELEASE_NAME)-epp.$(NAMESPACE).svc.cluster.local:5557",
              "topic": "kv@$(POD_IP)@MiniMaxAI/MiniMax-M2.5"
            }
          - "--disable-uvicorn-access-log"
          - "--compilation-config"
          - '{"cudagraph_mode":"PIECEWISE"}'
        env:
          - name: GAIE_RELEASE_NAME
            value: "{{ .Release.Name }}"
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: SAFETENSORS_FAST_GPU
            value: "1"
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_LOGGING_LEVEL
            value: DEBUG
          - name: TRITON_CACHE_DIR
            value: /.triton-cache
        ports:
          - containerPort: 8200
            name: vllm
            protocol: TCP
          - containerPort: 5600
            name: nixl
            protocol: TCP
        resources:
          limits:
            memory: 256Gi
            cpu: "48"
          requests:
            memory: 256Gi
            cpu: "48"
        mountModelVolume: true
        volumeMounts:
          - name: metrics-volume
            mountPath: /.config
          - name: shm
            mountPath: /dev/shm
          - name: torch-compile-cache
            mountPath: /.cache
          - name: triton-cache
            mountPath: /.triton-cache
        startupProbe:
          httpGet:
            path: /v1/models
            port: vllm
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: vllm
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/models
            port: vllm
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
    volumes:
      - name: metrics-volume
        emptyDir: {}
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "32Gi"
      - name: torch-compile-cache
        emptyDir: {}
      - name: triton-cache
        emptyDir: {}
  prefill:
    parallelism:
      tensor: 4
    create: true
    replicas: 2
    monitoring:
      podmonitor:
        enabled: true
        portName: "vllm"
        path: "/metrics"
        interval: "30s"
    containers:
      - name: "vllm"
        image: ghcr.io/llm-d/llm-d-cuda:v0.5.1
        modelCommand: vllmServe
        args:
          - "--trust-remote-code"
          - "--block-size"
          - "128"
          - "--max-model-len"
          - "131072"
          - "--gpu-memory-utilization"
          - "0.9"
          - "--enable-auto-tool-choice"
          - "--tool-call-parser"
          - "minimax_m2"
          - "--reasoning-parser"
          - "minimax_m2_append_think"
          - "--kv-transfer-config"
          - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          - "--kv-events-config"
          - |
            {
              "enable_kv_cache_events": true,
              "publisher": "zmq",
              "endpoint": "tcp://$(GAIE_RELEASE_NAME)-epp.$(NAMESPACE).svc.cluster.local:5557",
              "topic": "kv@$(POD_IP)@MiniMaxAI/MiniMax-M2.5"
            }
          - "--disable-uvicorn-access-log"
          - "--compilation-config"
          - '{"cudagraph_mode":"PIECEWISE"}'
        env:
          - name: GAIE_RELEASE_NAME
            value: "{{ .Release.Name }}"
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: SAFETENSORS_FAST_GPU
            value: "1"
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_LOGGING_LEVEL
            value: DEBUG
          - name: TRITON_CACHE_DIR
            value: /.triton-cache
        ports:
          - containerPort: 8000
            name: vllm
            protocol: TCP
          - containerPort: 5600
            name: nixl
            protocol: TCP
        resources:
          limits:
            memory: 256Gi
            cpu: "48"
          requests:
            memory: 256Gi
            cpu: "48"
        mountModelVolume: true
        volumeMounts:
          - name: metrics-volume
            mountPath: /.config
          - name: shm
            mountPath: /dev/shm
          - name: torch-compile-cache
            mountPath: /.cache
          - name: triton-cache
            mountPath: /.triton-cache
        startupProbe:
          httpGet:
            path: /v1/models
            port: vllm
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: vllm
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/models
            port: vllm
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
    volumes:
      - name: metrics-volume
        emptyDir: {}
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "32Gi"
      - name: torch-compile-cache
        emptyDir: {}
      - name: triton-cache
        emptyDir: {}

httpRoute:
  enabled: true
  nameOverride: ""
  pathPrefix: "/"

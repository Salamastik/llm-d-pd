# =============================================================================
# LAYER 2 — ROUTER / EPP override   (chart: inferencepool v1.3.1, vendored)
# =============================================================================
# The llm-d Endpoint Picker (EPP). Optimizations enabled here:
#   * Precise prefix-cache aware routing ..... via vLLM KV events (ZMQ :5557)
#   * P/D disaggregation routing ............. pd-profile-handler + prefix-based
#                                              decider (prefill vs decode profile)
#   * Load awareness ......................... kv-cache-utilization + queue scorers
# Retargeted from MiniMax-M2.5 to MiniMaxAI/MiniMax-M2.7.
# =============================================================================

gaie:
  inferenceExtension:
    replicas: 2                       # HA EPP for high scale
    flags:
      kv-cache-usage-percentage-metric: "vllm:kv_cache_usage_perc"
      v: 4
    image:
      name: llm-d-inference-scheduler
      hub: ghcr.io/llm-d
      tag: v0.6.0
      pullPolicy: Always
    extProcPort: 9002
    extraContainerPorts:
      - name: zmq
        containerPort: 5557
        protocol: TCP
    extraServicePorts:
      - name: zmq
        port: 5557
        targetPort: 5557
        protocol: TCP
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: hf-token
            key: HF_TOKEN
    sidecar:
      enabled: true
      image: ghcr.io/llm-d/llm-d-uds-tokenizer:v0.6.0
      imagePullPolicy: IfNotPresent
      name: tokenizer-uds
      env:
        - name: TOKENIZERS_DIR
          value: /tokenizers
        - name: HF_HOME
          value: /tokenizers
      volumeMounts:
        - mountPath: /tokenizers
          name: tokenizers
        - mountPath: /tmp/tokenizer
          name: tokenizer-uds
    volumes:
      - name: tokenizers
        emptyDir: {}
      - name: tokenizer-uds
        emptyDir: {}
    volumeMounts:
      - mountPath: /tmp/tokenizer
        name: tokenizer-uds
    pluginsConfigFile: "pd-precise-config.yaml"
    pluginsCustomConfig:
      pd-precise-config.yaml: |
        apiVersion: inference.networking.x-k8s.io/v1alpha1
        kind: EndpointPickerConfig
        featureGates:
        - prepareDataPlugins
        plugins:
        - type: prefill-header-handler
        - type: precise-prefix-cache-scorer
          parameters:
            tokenProcessorConfig:
              blockSize: 128
            indexerConfig:
              tokenizersPoolConfig:
                modelName: "MiniMaxAI/MiniMax-M2.7"
                local: null
                hf: null
                uds:
                  socketFile: /tmp/tokenizer/tokenizer-uds.socket
            kvEventsConfig:
              topicFilter: "kv@"
              concurrency: 4
              discoverPods: false
              zmqEndpoint: "tcp://*:5557"
        - type: kv-cache-utilization-scorer
        - type: queue-scorer
        - type: prefill-filter
        - type: decode-filter
        - type: max-score-picker
        - type: prefix-based-pd-decider
          parameters:
            nonCachedTokens: 16
        - type: pd-profile-handler
          parameters:
            primaryPort: 0
            deciderPluginName: prefix-based-pd-decider
            threshold: 256          # P/D split threshold (tune for ISL/OSL)
        schedulingProfiles:
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: max-score-picker
          - pluginRef: precise-prefix-cache-scorer
            weight: 3.0
          - pluginRef: kv-cache-utilization-scorer
            weight: 2.0
          - pluginRef: queue-scorer
            weight: 2.0
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: max-score-picker
          - pluginRef: precise-prefix-cache-scorer
            weight: 3.0
          - pluginRef: kv-cache-utilization-scorer
            weight: 2.0
          - pluginRef: queue-scorer
            weight: 2.0
    tracing:
      enabled: false
    monitoring:
      interval: "10s"
      prometheus:
        enabled: true
        auth:
          enabled: false
  inferencePool:
    targetPorts:
      - number: 8000
    modelServerType: vllm
    modelServers:
      matchLabels:
        llm-d.ai/inference-serving: "true"
        llm-d.ai/guide: "minimax-m2p7-highscale-pd"

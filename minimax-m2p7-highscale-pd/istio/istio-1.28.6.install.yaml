# =============================================================================
# Istio 1.28.6 control-plane install for llm-d Gateway mode (InferencePool v1)
# =============================================================================
# Why 1.28.6 and not 1.27.6:
#   Istio 1.27.x added Gateway API Inference Extension support but only for the
#   ALPHA InferencePool (inference.networking.x-k8s.io/v1alpha2). Istio 1.28.0
#   "Added support for InferencePool v1" and "Removed support for InferencePool
#   alpha and release candidate versions". The llm-d inferencepool chart emits a
#   STABLE inference.networking.k8s.io/v1 pool, so 1.28.x is the minimum.
#
# Install:
#   ISTIO_VERSION=1.28.6
#   curl -L https://istio.io/downloadIstio | ISTIO_VERSION=${ISTIO_VERSION} sh -
#   export PATH="$PWD/istio-${ISTIO_VERSION}/bin:$PATH"
#   istioctl install -y -f istio/istio-1.28.6.install.yaml
#
# Verify the build is actually 1.28.6:
#   istioctl version
# =============================================================================
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: llm-d-istio-1-28-6
spec:
  # Pin the exact patch release the user runs in their environment.
  tag: 1.28.6
  meshConfig:
    accessLogFile: /dev/stdout
  values:
    pilot:
      env:
        # Required: turn on the Gateway API Inference Extension (ext-proc to EPP).
        ENABLE_GATEWAY_API_INFERENCE_EXTENSION: "true"
        SUPPORT_GATEWAY_API_INFERENCE_EXTENSION: "true"
  components:
    pilot:
      k8s:
        resources:
          requests:
            cpu: "500m"
            memory: 2Gi

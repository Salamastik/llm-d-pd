apiVersion: v2
name: minimax-m2p7-highscale-pd
description: >-
  MiniMax-M2.7 very-high-scale deployment on llm-d combining precise
  prefix-cache aware routing, prefill/decode disaggregation (NIXL), and
  tiered KV CPU offloading. Gateway mode via Istio >= 1.28 (InferencePool v1).
type: application
version: 0.1.0
appVersion: "MiniMax-M2.7"

# These are the ORIGINAL upstream subcharts, vendored verbatim under charts/.
# All customization lives in the override files under overrides/ (never edit
# the charts themselves):
#   overrides/gateway.values.sand.yaml  -> Istio provider + high-scale conn pool
#   overrides/router.values.sand.yaml   -> EPP (inferencepool) precise prefix + P/D
#   overrides/model.values.sand.yaml    -> llm-d-modelservice P/D + CPU offload
dependencies:
  - name: llm-d-infra
    alias: infra
    version: v1.3.6
    repository: https://llm-d-incubation.github.io/llm-d-infra/
  - name: inferencepool
    alias: gaie
    version: v1.3.1
    repository: oci://registry.k8s.io/gateway-api-inference-extension/charts
  - name: llm-d-modelservice
    alias: modelservice
    version: v0.4.7
    repository: https://llm-d-incubation.github.io/llm-d-modelservice/

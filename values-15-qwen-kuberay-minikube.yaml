servingEngineSpec:
  runtimeClassName: ""
  imagePullPolicy: IfNotPresent
  modelSpec:
    - name: "qwen25-cpu-raycluster"
      repository: "vllm/vllm-openai"
      tag: "latest"
      modelURL: "Qwen/Qwen2.5-0.5B-Instruct"

      replicaCount: 1

      requestCPU: 1
      requestMemory: "2200Mi"
      limitCPU: "2"
      limitMemory: "3Gi"
      requestGPU: 0

      env:
        - name: VLLM_TARGET_DEVICE
          value: "cpu"
        - name: VLLM_LOGGING_LEVEL
          value: "INFO"
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "1"
        - name: HF_HUB_DISABLE_XET
          value: "1"

      vllmConfig:
        tensorParallelSize: 1
        pipelineParallelSize: 2
        maxModelLen: 512
        maxNumSeqs: 8
        extraArgs:
          - "--enforce-eager"
          - "--disable-uvicorn-access-log"

      shmSize: "1Gi"

      raySpec:
        headNode:
          requestCPU: 1
          requestMemory: "2400Mi"
          limitCPU: "2"
          limitMemory: "3Gi"
          requestGPU: 0

      hf_token:
        secretName: "hf-token"
        secretKey: "token"

routerSpec:
  enableRouter: false
